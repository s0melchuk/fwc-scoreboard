name: Publish package

on:
  release:
    types: [published]
  # release-on-merge.yml creates its Release using the default GITHUB_TOKEN, and GitHub
  # deliberately does not let events triggered by that token cascade into other workflows
  # (loop prevention) - so the `release: published` trigger above never fires for it.
  # workflow_dispatch is explicitly exempted from that restriction, so release-on-merge.yml
  # dispatches this workflow directly instead. A human creating a Release by hand still
  # triggers this normally via `release: published`.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # only set on workflow_dispatch; release events already check out the tag

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github # matches pom.xml distributionManagement/repository/id
          server-username: GITHUB_ACTOR # name of the env var holding the username at deploy time
          server-password: GITHUB_TOKEN # name of the env var holding the password/token at deploy time

      - name: Derive release version from tag
        id: version
        run: |
          # workflow_dispatch carries the tag as an explicit input; a release-triggered run
          # has already checked out the tag ref, so GITHUB_REF_NAME is the tag itself.
          tag="${{ inputs.tag }}"
          tag="${tag:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Publishing version: $version (from tag $tag)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set project version to the release tag
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # Runs the full lifecycle (compile, format check, tests, package, sources/javadoc jars)
      # before publishing, so a broken release tag can't slip a bad artifact into the registry.
      - name: Build, verify, and publish to GitHub Packages
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
