name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github # matches pom.xml distributionManagement/repository/id

      - name: Derive release version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Publishing version: $version (from tag $tag)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set project version to the release tag
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # Runs the full lifecycle (compile, format check, tests, package, sources/javadoc jars)
      # before publishing, so a broken release tag can't slip a bad artifact into the registry.
      - name: Build, verify, and publish to GitHub Packages
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
